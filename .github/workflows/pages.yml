name: Refresh news + Deploy to GitHub Pages

# This is the piece Lovable structurally can't do: Lovable hosts React/Next.js
# apps and doesn't run arbitrary Python, so the live news feed
# (fetch_competitor_news.py) would just go stale there forever. GitHub Actions
# can run real Python on a schedule, commit the result, and redeploy — so the
# self-updating behaviour this project always wanted lives here instead.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours — polite to Google News RSS, no documented rate limit to lean on
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a run that might be mid-commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live competitor news (Google News RSS, no API key)
        run: python3 fetch_competitor_news.py

      - name: Regenerate console_data.json
        run: python3 data_pipeline.py

      - name: Commit refreshed data, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/news/raw_items.json data/processed/console_data.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "Scheduled news refresh [skip ci]"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the commit the refresh job may have just pushed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
